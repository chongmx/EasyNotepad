plugins {
    id 'com.android.application'
}

android {
    namespace 'com.easynotepad.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.easynotepad.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            // aarch64 devices and x86_64 emulators / Chromebooks
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            // Fonts and bundled documents are shared with the desktop and web builds.
            assets.srcDirs = ['../../resources']
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1+'
        }
    }
}
