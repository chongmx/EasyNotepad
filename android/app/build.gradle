plugins {
    id 'com.android.application'
}

// The version lives in the repository's VERSION file (docs/RELEASING.md), as for every other build.
// versionCode must grow with every release: MAJOR * 10000 + MINOR * 100 + PATCH (1.1.0 -> 10100).
def appVersion = rootProject.file('../VERSION').text.trim()
def versionParts = appVersion.tokenize('.').collect { it as int }
if (versionParts.size() != 3)
    throw new GradleException("VERSION must be MAJOR.MINOR.PATCH, not '${appVersion}'")

android {
    namespace 'com.easynotepad.app'
    // The emoji pack is read in parts (AAsset_seek): it must be stored, not deflated, in the APK.
    androidResources {
        noCompress += ['zip']
    }
    compileSdk 35
    // Another installed NDK release can be used with -PndkVersion=<its Pkg.Revision>.
    if (project.hasProperty('ndkVersion'))
        ndkVersion project.property('ndkVersion')

    defaultConfig {
        applicationId 'com.easynotepad.app'
        minSdk 24
        targetSdk 35
        versionCode versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
        versionName appVersion

        ndk {
            // aarch64 devices and x86_64 emulators / Chromebooks
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                // -PreleaseTag=v<VERSION> (CI, building a release tag): a release build (docs/RELEASING.md).
                arguments '-DANDROID_STL=c++_static', "-DENP_RELEASE_TAG=${project.findProperty('releaseTag') ?: ''}"
            }
        }
    }

    // The release key comes from Gradle properties, never from the repository:
    //   -PreleaseStoreFile=<keystore> -PreleaseStorePassword=... -PreleaseKeyAlias=... -PreleaseKeyPassword=...
    // Without them a release build is signed with the debug key: installable for testing, not for Play.
    signingConfigs {
        release {
            if (project.hasProperty('releaseStoreFile')) {
                storeFile file(project.property('releaseStoreFile'))
                storePassword project.property('releaseStorePassword')
                keyAlias project.property('releaseKeyAlias')
                keyPassword project.property('releaseKeyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig project.hasProperty('releaseStoreFile') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            // Fonts and bundled documents are shared with the desktop and web builds.
            assets.srcDirs = ['../../resources']
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1+'
        }
    }
}

// Like the other platforms' binaries (bin/<os>/<arch>/), each APK is also copied to bin/android/
// at the repository root: EasyNotepad-debug.apk, EasyNotepad-release.apk. One APK holds every ABI.
android.applicationVariants.all { variant ->
    variant.assembleProvider.configure { task ->
        task.doLast {
            project.copy {
                from variant.outputs.collect { it.outputFile }
                into rootProject.file('../bin/android')
                rename { "EasyNotepad-${variant.name}.apk" }
            }
        }
    }
}
