    <style>
        :root { color-scheme: light dark; }
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1b1f24; }
        #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border: 0; outline: none; }
        #status {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font: 15px system-ui, sans-serif; color: #8b949e; pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="status">Loading EasyNotepad&hellip;</div>
    <script>
        var statusElement = document.getElementById('status');
        var Module = {
            canvas: (function () { return document.getElementById('canvas'); })(),
            print: function (text) { console.log(text); },
            printErr: function (text) { console.error(text); },
            setStatus: function (text) {
                statusElement.textContent = text;
                statusElement.style.display = text ? 'flex' : 'none';
            },
            onRuntimeInitialized: function () { statusElement.style.display = 'none'; }
        };
        window.addEventListener('error', function () {
            Module.setStatus('EasyNotepad failed to start - see the browser console.');
        });
    </script>

</body>
