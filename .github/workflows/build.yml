name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# Jobs only read the repository; the release job alone may write (it publishes a release).
permissions:
  contents: read

jobs:
  # The version (docs/RELEASING.md): VERSION is MAJOR.MINOR.PATCH and CHANGELOG.md has its
  # section; a tag v* must be v + VERSION, with its section dated. Every build takes the version
  # from here for its artifact names, and the tag (when building one) to be a release build.
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Check VERSION and CHANGELOG.md
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(tr -d ' \r\n' < VERSION)
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION::VERSION must be MAJOR.MINOR.PATCH, not '$version'"
            exit 1
          fi
          header=$(grep -E "^## \[${version//./\\.}\]" CHANGELOG.md || true)
          if [ -z "$header" ]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no section '## [$version]'"
            exit 1
          fi
          release_tag=""
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::Tag $REF_NAME does not match VERSION ($version): tag v$version, or change VERSION"
              exit 1
            fi
            if echo "$header" | grep -qi unreleased; then
              echo "::error file=CHANGELOG.md::Date the [$version] section of CHANGELOG.md before tagging"
              exit 1
            fi
            release_tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "EasyNotepad $version${release_tag:+ (release $release_tag)}" >> "$GITHUB_STEP_SUMMARY"

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,     os: windows-latest,   preset: windows-x64,     test: true }
          - { name: windows-x86,     os: windows-latest,   preset: windows-x86,     test: true }
          - { name: windows-arm64,   os: windows-latest,   preset: windows-arm64,   test: false }
          - { name: linux-x64,       os: ubuntu-22.04,     preset: linux,           test: true }
          - { name: linux-arm64,     os: ubuntu-22.04-arm, preset: linux,           test: true }
          - { name: macos-universal, os: macos-latest,     preset: macos-universal, test: true }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} "-DENP_RELEASE_TAG=${{ needs.version.outputs.release_tag }}"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        if: matrix.test
        run: ctest --test-dir build/${{ matrix.preset }} -C Release --output-on-failure

      # macOS only: a memory benchmark instead of the strict checks (its footprint moves by whole
      # pages and its allocator keeps freed pages, so readings differ without any leak). 30 open and
      # close cycles; it passes while the growth overall and over the last 10 cycles stays under the
      # limits (scripts/memory_cycle.py --bench). The numbers are an annotation of every run. The
      # runner is a virtual machine without a GPU (no OpenGL window): the app runs --headless.
      # TEMPORARY COMPROMISE (2026-11-05, docs/MEMORY.md "macOS benchmark"): over the last 10 cycles
      # the C++ heap and its blocks may not grow at all, and the footprint by at most 20 KB (the
      # first green run measured +16 KB: one 16 KB page). To be replaced by the full checks.
      # TEMPORARY (2026-11-06): a failed benchmark is run once more before the job fails (the macOS
      # virtual machine's footprint readings are noisy: a run can fail and the next pass). Only this
      # step repeats; the first attempt's result stays in the log and as an annotation.
      - name: Benchmark macOS folder-cycle memory
        if: runner.os == 'macOS' && matrix.test
        run: |
          for attempt in 1 2; do
            if python3 scripts/memory_cycle.py \
                --app bin/macos/universal/EasyNotepad \
                --folder "$GITHUB_WORKSPACE" \
                --files CMakeLists.txt docs/MEMORY.md src/os/common/OsCommon.cpp tests/TestMain.cpp \
                --cycles 30 --warmup 5 --bench --headless \
                --bench-private-last10-kb 20 --bench-heap-last10-kb 0 --bench-blocks-last10 0; then
              [ "$attempt" -gt 1 ] && echo "::warning title=memory benchmark::passed on attempt $attempt (attempt 1 failed: see above)"
              exit 0
            fi
            echo "::warning title=memory benchmark::attempt $attempt failed"
          done
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: EasyNotepad-${{ needs.version.outputs.version }}-${{ matrix.name }}
          path: bin/

  web:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Emscripten from its own repository at a fixed version: no third-party action, and the
      # same compiler on every run. Raise EMSDK_VERSION deliberately.
      - name: Install Emscripten
        env:
          EMSDK_VERSION: 6.0.13
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
          source ./emsdk_env.sh
          # Keep what emsdk_env.sh set for the following steps.
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EMSDK_NODE=$EMSDK_NODE" >> "$GITHUB_ENV"
          echo "$PATH" | tr ':' '\n' | grep -F "$EMSDK" >> "$GITHUB_PATH"
          emcc --version
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset web "-DENP_RELEASE_TAG=${{ needs.version.outputs.release_tag }}"
      - name: Build
        run: cmake --build --preset web
      - uses: actions/upload-artifact@v7
        with:
          name: EasyNotepad-${{ needs.version.outputs.version }}-web
          path: bin/web/

  android:
    needs: version
    runs-on: ubuntu-22.04
    env:
      # The app's own release key (scripts/android-release-key.sh), from the repository's secrets.
      # With it a signed release APK is built too; without it only the debug APK.
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: Build debug APK (arm64-v8a, x86_64)
        working-directory: android
        run: gradle assembleDebug "-PreleaseTag=${{ needs.version.outputs.release_tag }}"
      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # Gradle reads ORG_GRADLE_PROJECT_<name> as the project property <name> (app/build.gradle).
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          gradle assembleRelease "-PreleaseTag=${{ needs.version.outputs.release_tag }}" \
            "-PreleaseStoreFile=$RUNNER_TEMP/release.jks"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: EasyNotepad-${{ needs.version.outputs.version }}-android
          path: bin/android/*.apk

  # A tag v<VERSION> pushed and every build passed: the GitHub Release, with one download per
  # platform and the version's CHANGELOG.md section as its notes (docs/RELEASING.md).
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [version, desktop, web, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir dist
          for dir in artifacts/EasyNotepad-"$VERSION"-*; do
            name=$(basename "$dir")
            case "$name" in
              *-android) # EasyNotepad-debug.apk -> EasyNotepad-<version>-android-debug.apk
                for apk in "$dir"/*.apk; do
                  base=$(basename "$apk" .apk)
                  cp "$apk" "dist/$name-${base#EasyNotepad-}.apk"
                done ;;
              *)
                # The app and its resources: not the test programs. Artifacts lose the executable
                # bit; the zips have it back.
                find "$dir" \( -name 'enp_tests*' -o -name 'enp_ui_tests*' \) -delete
                find "$dir" -type f -name EasyNotepad -exec chmod +x {} +
                (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" .) ;;
            esac
          done
          ls -l dist
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --verify-tag --title "EasyNotepad $VERSION" --notes-file notes.md
